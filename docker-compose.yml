services:
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      # Book catalog (incoming/valid/invalid) and the H2 save file survive restarts
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend/Dockerfile
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy
