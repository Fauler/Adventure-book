spring.application.name=adventurebook

# ---- Book flat-file catalog ----
adventurebook.books.incoming-dir=data/books/incoming
adventurebook.books.valid-dir=data/books/valid
adventurebook.books.invalid-dir=data/books/invalid

# ---- Saved-game persistence (file-based H2) ----
spring.datasource.url=jdbc:h2:file:./data/db/adventurebook
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info

# ---- Logging: include traceId/spanId for request correlation ----
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

