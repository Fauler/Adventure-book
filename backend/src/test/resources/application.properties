spring.application.name=adventurebook

# ---- Book flat-file catalog ----
adventurebook.books.incoming-dir=data/books/incoming
adventurebook.books.valid-dir=data/books/valid
adventurebook.books.invalid-dir=data/books/invalid

# ---- Saved-game persistence: in-memory H2 for tests ----
# Isolated from the dev file database (`./data/db/adventurebook`) so running tests
# never collides with a locally running dev instance (e.g. started from the IDE)
# holding the file lock.
spring.datasource.url=jdbc:h2:mem:adventurebook-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info

# ---- Logging: include traceId/spanId for request correlation ----
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
